paths:
  /auth/callback:
    post:
      tags:
        - Authentication
      summary: Exchange authorization code for access token
      description: Handles OAuth callback and exchanges the code for an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  description: Authorization code from Casdoor
                state:
                  type: string
                  description: State parameter from OAuth flow
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Bad request
        '500':
          description: Server error

  /auth/refresh-token:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Uses a refresh token to get a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: Refresh token
      responses:
        '200':
          description: Successfully refreshed token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Bad request
        '500':
          description: Server error

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user information
      description: Returns information about the currently authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401':
          description: Unauthorized
        '500':
          description: Server error

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Invalidates the current session
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully logged out
        '401':
          description: Unauthorized
        '500':
          description: Server error

  /auth/validate:
    get:
      tags:
        - Authentication
      summary: Validate token
      description: Checks if the provided token is valid
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  isAdmin:
                    type: boolean
        '401':
          description: Unauthorized
        '500':
          description: Server error

components:
  schemas:
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        id_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        scope:
          type: string
    
    UserInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        displayName:
          type: string
        avatar:
          type: string
        email:
          type: string
        isAdmin:
          type: boolean
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
  
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
