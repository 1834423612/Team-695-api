openapi: 3.0.0
info:
  title: Team 695 API
  description: Team 695 API Documentation for multiple services including authentication, events, surveys, teams, uploads, and feedback
  version: 1.0.0
servers:
  - url: http://localhost:3000/api
    description: Development server
  - url: https://api.team695.com
    description: Production server
tags: 
  - name: Auth
    description: APIs related to authentication and authorization
  - name: Events
    description: APIs related to event management
  - name: Surveys
    description: APIs related to survey submissions and queries
  - name: Teams
    description: APIs related to team information
  - name: Uploads
    description: APIs for uploading and managing files
  - name: Feedback
    description: APIs for submitting feedback
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the request was successful
        message:
          type: string
          description: Optional message providing additional information
        data:
          type: object
          description: Response data (varies by endpoint)
        error:
          type: string
          description: Error details (only in non-production environments)
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT Access Token
        refresh_token:
          type: string
          description: JWT Refresh Token for obtaining a new access token
        token_type:
          type: string
          description: Token Type (usually "Bearer")
        expires_in:
          type: integer
          description: Access Token Expiration Time in seconds
    UserInfo:
      type: object
      properties:
        sub:
          type: string
          description: User ID
        name:
          type: string
          description: User Name
        email:
          type: string
          description: User Email
        preferred_username:
          type: string
          description: Preferred Username
        owner:
          type: string
          description: Owner of the user
        role:
          type: string
          description: User role
        isAdmin:
          type: boolean
          description: Whether the user is an admin
        groups:
          type: array
          items:
            type: string
          description: User groups
    DecodedToken:
      type: object
      properties:
        header:
          type: object
          properties:
            alg:
              type: string
              description: Algorithm used for token signing
            kid:
              type: string
              description: Key ID
            typ:
              type: string
              description: Token type
        payload:
          $ref: '#/components/schemas/UserInfo'
        signature:
          type: string
          description: Token signature
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Refresh token to exchange for a new access token
    FeedbackRequest:
      type: object
      properties:
        nickname:
          type: string
          description: Name of the person submitting feedback
        category:
          type: string
          description: Feedback category
        title:
          type: string
          description: Feedback title
        contact:
          type: string
          description: Contact information (usually email)
        content:
          type: string
          description: Feedback content
        deviceInfo:
          type: object
          properties:
            userAgent:
              type: string
            ip:
              type: string
            screenSize:
              type: string
            language:
              type: string
    UploadResponse:
      type: object
      properties:
        url:
          type: string
          description: URL of the uploaded file
    EventResponse:
      type: object
      properties:
        eventId:
          type: string
          description: ID of the current event
    TeamResponse:
      type: object
      properties:
        team_number:
          type: string
          description: Team number
        team_name:
          type: string
          description: Team name
    SurveySubmissionRequest:
      type: object
      properties:
        eventId:
          type: string
          description: ID of the event
        tabs:
          type: array
          items:
            type: object
            properties:
              formId:
                type: string
              formData:
                type: array
                items:
                  type: object
        images:
          type: object
          properties:
            fullRobotImages:
              type: array
              items:
                $ref: '#/components/schemas/ImageData'
            driveTrainImages:
              type: array
              items:
                $ref: '#/components/schemas/ImageData'
        userData:
          type: object
          properties:
            email:
              type: string
            avatar:
              type: string
            userId:
              type: string
            username:
              type: string
            displayName:
              type: string
        deviceInfo:
          type: object
          properties:
            userAgent:
              type: string
            ip:
              type: string
            language:
              type: string
    ImageData:
      type: object
      properties:
        url:
          type: string
          description: URL of the image
        name:
          type: string
          description: Name of the image
        size:
          type: number
          description: Size of the image in bytes
    SurveyResponse:
      type: object
      properties:
        id:
          type: integer
        event_id:
          type: string
        form_id:
          type: string
        data:
          type: object
        upload:
          type: object
        user_data:
          type: object
        user_agent:
          type: string
        ip:
          type: string
        language:
          type: string
        timestamp:
          type: string
          format: date-time

paths:
  /auth/callback:
    post:
      summary: Exchange authorization code for access token
      description: Process the authorization code returned from Casdoor and exchange it for an access token
      tags:
        - Auth
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
          description: Authorization code returned from Casdoor
      responses:
        '200':
          description: Successfully exchanged code for token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/user-info:
    get:
      summary: Decode JWT token and return user info
      description: Decode the JWT token and return user information
      tags:
        - Auth
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
          description: JWT Token to decode
      responses:
        '200':
          description: User information decoded from the token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/DecodedToken'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/me:
    get:
      summary: Get current user info
      description: Retrieve the current user's information using the provided JWT token
      tags:
        - Auth
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: token
          schema:
            type: string
          description: JWT Token (optional, if not provided in Authorization header)
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserInfo'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/validate:
    get:
      summary: Validate JWT token
      description: Validate the provided JWT token and return the result
      tags:
        - Auth
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: token
          schema:
            type: string
          description: JWT Token (optional, if not provided in Authorization header)
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          valid:
                            type: boolean
                          isAdmin:
                            type: boolean
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/refresh-token:
    post:
      summary: Refresh access token
      description: Use a refresh token to obtain a new access token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/logout:
    post:
      summary: Logout user
      description: Revokes the current token by calling both Casdoor logout and delete-token endpoints, and adds it to the local blacklist
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: "Logged out successfully"
                          details:
                            type: object
                            properties:
                              localBlacklist:
                                type: boolean
                              casdoorLogout:
                                type: boolean
                              casdoorDeleteToken:
                                type: boolean
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/revoke-token:
    post:
      summary: Revoke a specific token (Admin only)
      description: Allows administrators to revoke a specific token
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: The token to revoke
      responses:
        '200':
          description: Token revoked successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
                            example: "Token revoked successfully"
                          details:
                            type: object
                            properties:
                              localBlacklist:
                                type: boolean
                              casdoorLogout:
                                type: boolean
                              casdoorDeleteToken:
                                type: boolean
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          description: Forbidden - Admin privileges required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /auth/users:
    get:
      summary: Get all users in organization (admin only)
      description: Retrieve all users from the organization (admin only)
      tags:
        - Auth
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 100
          description: Number of users per page
        - in: query
          name: pageNumber
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: sortField
          schema:
            type: string
          description: Field to sort users by
        - in: query
          name: sortOrder
          schema:
            type: string
            enum: [asc, desc]
          description: Sort order
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          data:
                            type: array
                            items:
                              $ref: '#/components/schemas/UserInfo'
                          total:
                            type: integer
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '403':
          description: Forbidden - Admin privileges required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /feedback:
    post:
      summary: Submit feedback
      description: Submit feedback for the website or service
      tags:
        - Feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '201':
          description: Feedback submitted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
        '429':
          description: Too many requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /upload/upload:
    post:
      summary: Upload a file
      description: Upload an image file to the server
      tags:
        - Uploads
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload
                type:
                  type: string
                  description: Type of upload (e.g., 'robots', 'drivetrain')
      responses:
        '200':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UploadResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /upload/images/{imageId}:
    delete:
      summary: Delete an image
      description: Delete an uploaded image by ID
      tags:
        - Uploads
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: imageId
          required: true
          schema:
            type: string
          description: ID of the image to delete
      responses:
        '200':
          description: Image deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          description: Image not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /event/event-id:
    get:
      summary: Get current event ID
      description: Retrieve the ID of the most recent event
      tags:
        - Events
      responses:
        '200':
          description: Event ID retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/EventResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /team/teams:
    get:
      summary: Get list of teams
      description: Retrieve a list of all teams with their numbers and names
      tags:
        - Teams
      responses:
        '200':
          description: Teams retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TeamResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /survey/submit:
    post:
      summary: Submit survey response
      description: Submit a new survey response for an event
      tags:
        - Surveys
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurveySubmissionRequest'
      responses:
        '200':
          description: Survey submitted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          message:
                            type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /survey/query:
    get:
      summary: Query survey responses
      description: Query survey responses with optional filtering
      tags:
        - Surveys
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: eventId
          schema:
            type: string
          description: Filter by event ID
        - in: query
          name: formId
          schema:
            type: string
          description: Filter by form ID
        - in: query
          name: teamNumber
          schema:
            type: string
          description: Filter by team number
      responses:
        '200':
          description: Survey responses retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SurveyResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
