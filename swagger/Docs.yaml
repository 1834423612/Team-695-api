    get:
      summary: Validate JWT token or API Key with server
      description: >
        Performs a complete validation of the provided JWT token or API Key by
        verifying with the Casdoor server.

        This endpoint checks if the token has been revoked, is still active, and
        returns its admin status.

        Use this endpoint for security-critical operations requiring full token
        validation.
      tags:
        - Auth
      security:
        - bearerAuth: []
        - apiKeyAuth: []
          apiSecretAuth: []
      parameters:
        - in: query
          name: token
          schema:
            type: string
          description: JWT Token (optional, if not provided in Authorization header)
        - in: query
          name: bypassCache
          schema:
            type: boolean
            default: false
          description: Force verification with server, bypassing cached results
      responses:
        "200":
          description: Token is valid according to server verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAuthValidateSuccess"
        "401":
          description: Unauthorized - Token is invalid, expired, or has been revoked on
            the server
          content:
