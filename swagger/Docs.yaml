openapi: 3.0.0
info:
  title: Team 695 API
  description: Team 695 API Documentation for multiple services including
    authentication, events, surveys, teams, uploads, and feedback
  version: 1.5.6
servers:
  - url: https://api.team695.com
    description: Production server
  - url: http://localhost:3000/api
    description: Development server
tags:
  - name: Auth
    description: APIs related to authentication and authorization
  - name: Events
    description: APIs related to event management
  - name: Surveys
    description: APIs related to survey submissions and queries
  - name: Teams
    description: APIs related to team information
  - name: Uploads
    description: APIs for uploading and managing files
  - name: Feedback
    description: APIs for submitting feedback
  - name: Webhooks
    description: APIs for receiving webhook notifications from external services
  - name: Assignments
    description: APIs related to task assignments
  - name: TeamMatches
    description: APIs related to team matches and pit-scouting status
  - name: Info
    description: APIs for retrieving API information and status
  - name: Scoutify
    description: APIs for reading data from the Scoutify secondary database
x-error-catalog:
  global:
    invalidJsonPayload:
      status: 400
      message: Invalid JSON payload
      appliesTo:
        - POST endpoints with application/json body
        - PUT endpoints with application/json body
        - PATCH endpoints with application/json body
    authMiddleware401:
      status: 401
      messages:
        - No authentication token provided
        - Token has been revoked
        - Token is invalid or has been revoked
        - Token has expired
        - Token validation failed
        - Failed to verify token
    requireAdmin:
      statusCodes:
        - 401
        - 403
        - 500
      messages:
        "401":
          - Authentication required
        "403":
          - Admin privileges required
        "500":
          - Failed to verify admin privileges
    rateLimit:
      status: 429
      messages:
        api:
          - Too many requests per second, please slow down.
          - Too many requests per minute, please try again later.
        auth:
          - Too many authentication attempts per second.
          - Too many authentication attempts per minute.
        feedback:
          - Too many feedback submissions per second.
          - Too many feedback submissions per minute.
        scoutifyPublic:
          - Too many Scoutify query requests per second.
          - Too many Scoutify query requests per minute.
  endpoints:
    /auth/callback:
      post:
        "400":
          - Authorization code required
        "429":
          - Too many authentication attempts per second.
          - Too many authentication attempts per minute.
        "500":
          - Authentication failed
    /auth/user-info:
      get:
        "400":
          - Token required
        "429":
          - Too many authentication attempts per second.
          - Too many authentication attempts per minute.
        "500":
          - Failed to proxy to Casdoor
          - Failed to get user information
    /auth/me:
      get:
        "401":
          - Please provide a valid JWT token or API Key/Secret
        "429":
          - Too many authentication attempts per second.
          - Too many authentication attempts per minute.
        "500":
          - Failed to proxy to Casdoor
          - Failed to get user information
    /auth/validate:
      get:
        "401":
          - Authentication required
          - Token/API Key is no longer valid
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
        "429":
          - Too many authentication attempts per second.
          - Too many authentication attempts per minute.
        "500":
          - Failed to validate token
    /auth/refresh-token:
      post:
        "400":
          - Refresh token required
          - Invalid JSON payload
        "429":
          - Too many authentication attempts per second.
          - Too many authentication attempts per minute.
        "500":
          - Failed to refresh token
    /auth/logout:
      post:
        "400":
          - Token required
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
        "429":
          - Too many authentication attempts per second.
          - Too many authentication attempts per minute.
    /auth/revoke-token:
      post:
        "400":
          - Token required
          - Invalid JSON payload
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
          - Authentication required
        "403":
          - Admin privileges required
        "429":
          - Too many authentication attempts per second.
          - Too many authentication attempts per minute.
        "500":
          - Failed to revoke token
          - Failed to verify admin privileges
    /auth/users:
      get:
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
          - Authentication required
        "403":
          - Admin privileges required
        "429":
          - Too many authentication attempts per second.
          - Too many authentication attempts per minute.
        "500":
          - Failed to retrieve users
          - Failed to verify admin privileges
    /auth/api-keys:
      post:
        "400":
          - No valid authentication provided
          - Invalid JSON payload
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
        "429":
          - Too many authentication attempts per second.
          - Too many authentication attempts per minute.
        "500":
          - Failed to generate API keys
          - Failed to generate API keys: <upstream error>
    /feedback:
      post:
        "429":
          - Too many feedback submissions per second.
          - Too many feedback submissions per minute.
        "500":
          - Database insertion error
    /upload/upload:
      post:
        "400":
          - No file uploaded
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
        "404":
          - Event not found
        "500":
          - Failed to upload image
    /upload/images/{imageId}:
      delete:
        "401":
          - Authentication required
        "403":
          - Admin privileges required
        "404":
          - Image not found
          - Image not found in the specified type
        "500":
          - Failed to verify admin privileges
          - Failed to delete image
    /event/event-id:
      get:
        "404":
          - Event not found
        "500":
          - Failed to fetch event ID
    /team/teams:
      get:
        "500":
          - Failed to fetch teams
    /survey/submit:
      post:
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
        "500":
          - Failed to submit survey
    /survey/query:
      get:
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
        "500":
          - Failed to query survey responses
    /webhook/tba:
      post:
        "401":
          - Missing X-TBA-HMAC header
          - Invalid X-TBA-HMAC signature
        "500":
          - Server configuration error
          - Error verifying webhook signature
          - Error processing webhook
    /webhook/tba/status:
      get:
        "500":
          - Error getting webhook status
    /assignments:
      post:
        "400":
          - Missing required fields or no assignees specified
          - Team numbers are required for pit-scouting tasks
          - Alliance and matches are required for scouting tasks
          - Invalid JSON payload
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
          - Authentication required
        "403":
          - Admin privileges required
        "500":
          - Failed to create assignment
          - Error creating assignment
          - Failed to verify admin privileges
    /assignments/{id}:
      put:
        "400":
          - Invalid JSON payload
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
          - Authentication required
        "403":
          - Admin privileges required
        "404":
          - Assignment not found or no changes applied
        "500":
          - Error updating assignment
          - Failed to verify admin privileges
      delete:
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
          - Authentication required
        "403":
          - Admin privileges required
        "404":
          - Assignment not found
        "500":
          - Error deleting assignment
          - Failed to verify admin privileges
    /assignments/events/{eventKey}:
      get:
        "400":
          - Event key is required
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
          - Authentication required
        "403":
          - Admin privileges required
        "500":
          - Error getting event assignments
          - Failed to verify admin privileges
    /assignments/user/{eventKey}:
      get:
        "400":
          - Event key is required
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
          - Authentication required
        "500":
          - Error getting user assignments
    /team-matches/event/{eventKey}:
      get:
        "400":
          - Event key is required
        "500":
          - Error getting teams for event
    /team-matches/pit-status/{eventKey}/{teamKey}:
      put:
        "400":
          - Event key and team key are required
          - is_pit status is required
          - Invalid JSON payload
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
        "404":
          - Team not found for this event (using team key: <value>)
        "500":
          - Error updating pit-scouting status
    /team-matches/pit-status/{eventKey}/{teamNumber}:
      put:
        "400":
          - Event key and team number are required
          - is_pit status is required
          - Invalid JSON payload
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
        "404":
          - Team not found for this event (using team number: <value>)
        "500":
          - Error updating pit-scouting status
    /scoutify/user/me:
      get:
        "404":
          - No Scoutify user binding found for current Casdoor user
        "500":
          - Failed to get Scoutify user binding
    /scoutify/user/me/android-device:
      get:
        "404":
          - No Scoutify user binding found for current Casdoor user
        "500":
          - Failed to get Android device binding
      patch:
        "400":
          - androidDeviceId is required
          - Invalid JSON payload
        "404":
          - No Scoutify user binding found for current Casdoor user
        "500":
          - Failed to update Android device binding
    /scoutify/game-matchups:
      get:
        "429":
          - Too many Scoutify query requests per second.
          - Too many Scoutify query requests per minute.
        "500":
          - Failed to query game matchups
    /scoutify/game-details:
      get:
        "429":
          - Too many Scoutify query requests per second.
          - Too many Scoutify query requests per minute.
        "500":
          - Failed to query game details
    /scoutify/game-comments:
      get:
        "429":
          - Too many Scoutify query requests per second.
          - Too many Scoutify query requests per minute.
        "500":
          - Failed to query game comments
      post:
        "400":
          - Missing required fields for game comment
          - Invalid numeric fields for game comment
          - gc_comment is required
          - gc_comment must be 200 characters or fewer after sanitization
          - Invalid JSON payload
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
        "404":
          - No Scoutify user binding found for current Casdoor user
        "500":
          - Failed to create game comment
    /scoutify/event-assignments:
      get:
        "404":
          - No Scoutify user binding found for current Casdoor user
        "500":
          - Failed to query event assignments
    /scoutify/event-tasks:
      get:
        "404":
          - No Scoutify user binding found for current Casdoor user
        "500":
          - Failed to query event tasks
    /scoutify/admin/users/{teamNumber}/{scoutifyUserId}/android-device:
      patch:
        "400":
          - teamNumber and scoutifyUserId are required
          - androidDeviceId must be a string or null
          - Invalid JSON payload
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
        "403":
          - Admin privileges required
        "404":
          - Scoutify user not found
        "500":
          - Failed to update Android device binding
          - Failed to verify admin privileges
    /scoutify/admin/game-details:
      post:
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
        "403":
          - Admin privileges required
        "500":
          - Failed to create game detail
          - Failed to verify admin privileges
      put:
        "400":
          - match and changes are required
          - Invalid JSON payload
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
        "403":
          - Admin privileges required
        "404":
          - No game detail row updated
        "500":
          - Failed to update game detail
          - Failed to verify admin privileges
      delete:
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
        "403":
          - Admin privileges required
        "404":
          - No game detail row deleted
        "500":
          - Failed to delete game detail
          - Failed to verify admin privileges
    /scoutify/admin/event-assignments:
      post:
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
        "403":
          - Admin privileges required
        "500":
          - Failed to create event assignment
          - Failed to verify admin privileges
      delete:
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
        "403":
          - Admin privileges required
        "404":
          - No event assignment row deleted
        "500":
          - Failed to delete event assignment
          - Failed to verify admin privileges
    /scoutify/admin/event-tasks:
      post:
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
        "403":
          - Admin privileges required
        "500":
          - Failed to create event task
          - Failed to verify admin privileges
    /scoutify/admin/event-tasks/{taskId}:
      put:
        "400":
          - taskId is required
          - Invalid JSON payload
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
        "403":
          - Admin privileges required
        "404":
          - No event task row updated
        "500":
          - Failed to update event task
          - Failed to verify admin privileges
      delete:
        "400":
          - taskId is required
        "401":
          - No authentication token provided
          - Token has been revoked
          - Token is invalid or has been revoked
          - Token has expired
          - Token validation failed
          - Failed to verify token
        "403":
          - Admin privileges required
        "404":
          - No event task row deleted
        "500":
          - Failed to delete event task
          - Failed to verify admin privileges
    /info/endpoints:
      get:
        "429":
          - Too many requests per second, please slow down.
          - Too many requests per minute, please try again later.
        "500":
          - Failed to retrieve API endpoints
    /info/endpoints/by-tag/{tag}:
      get:
        "429":
          - Too many requests per second, please slow down.
          - Too many requests per minute, please try again later.
        "500":
          - Failed to retrieve API endpoints by tag
    /info/api-info:
      get:
        "429":
          - Too many requests per second, please slow down.
          - Too many requests per minute, please try again later.
        "500":
          - Failed to retrieve API information
    /info/status:
      get:
        "429":
          - Too many requests per second, please slow down.
          - Too many requests per minute, please try again later.
        "500":
          - Failed to retrieve status
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Also called Access Key
    apiSecretAuth:
      type: apiKey
      in: header
      name: X-API-Secret
      description: Used together with X-API-Key, also called Access Secret Key
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the request was successful
        message:
          type: string
          description: Optional message providing additional information
        data:
          type: object
          description: Response data (varies by endpoint)
        error:
          type: string
          description: Error details (only in non-production environments)
    ApiErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          enum:
            - false
          description: Always false for error responses
        message:
          type: string
          description: Error message
        error:
          type: string
          description: Error details (only in non-production environments)
      example:
        success: false
        message: Unauthorized
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT Access Token
        refresh_token:
          type: string
          description: JWT Refresh Token for obtaining a new access token
        token_type:
          type: string
          description: Token Type (usually "Bearer")
        expires_in:
          type: integer
          description: Access Token Expiration Time in seconds
    UserInfo:
      type: object
      properties:
        sub:
          type: string
          description: User ID
        name:
          type: string
          description: User Name
        email:
          type: string
          description: User Email
        preferred_username:
          type: string
          description: Preferred Username
        owner:
          type: string
          description: Owner of the user
        role:
          type: string
          description: User role
        isAdmin:
          type: boolean
          description: Whether the user is an admin
        groups:
          type: array
          items:
            type: string
          description: User groups
    DecodedToken:
      type: object
      properties:
        header:
          type: object
          properties:
            alg:
              type: string
              description: Algorithm used for token signing
            kid:
              type: string
              description: Key ID
            typ:
              type: string
              description: Token type
        payload:
          $ref: "#/components/schemas/UserInfo"
        signature:
          type: string
          description: Token signature
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Refresh token to exchange for a new access token
    FeedbackRequest:
      type: object
      properties:
        nickname:
          type: string
          description: Name of the person submitting feedback
        category:
          type: string
          description: Feedback category
        title:
          type: string
          description: Feedback title
        contact:
          type: string
          description: Contact information (usually email)
        content:
          type: string
          description: Feedback content
        deviceInfo:
          type: object
          properties:
            userAgent:
              type: string
            ip:
              type: string
            screenSize:
              type: string
            language:
              type: string
    UploadResponse:
      type: object
      properties:
        url:
          type: string
          description: URL of the uploaded file
    EventResponse:
      type: object
      properties:
        eventId:
          type: string
          description: ID of the current event
    TeamResponse:
      type: object
      properties:
        team_number:
          type: string
          description: Team number
        team_name:
          type: string
          description: Team name
    SurveySubmissionRequest:
      type: object
      properties:
        eventId:
          type: string
          description: ID of the event
        tabs:
          type: array
          items:
            type: object
            properties:
              formId:
                type: string
              formData:
                type: array
                items:
                  type: object
        images:
          type: object
          properties:
            fullRobotImages:
              type: array
              items:
                $ref: "#/components/schemas/ImageData"
            driveTrainImages:
              type: array
              items:
                $ref: "#/components/schemas/ImageData"
        userData:
          type: object
          properties:
            email:
              type: string
            avatar:
              type: string
            userId:
              type: string
            username:
              type: string
            displayName:
              type: string
        deviceInfo:
          type: object
          properties:
            userAgent:
              type: string
            ip:
              type: string
            language:
              type: string
    ImageData:
      type: object
      properties:
        url:
          type: string
          description: URL of the image
        name:
          type: string
          description: Name of the image
        size:
          type: number
          description: Size of the image in bytes
    SurveyResponse:
      type: object
      properties:
        id:
          type: integer
        event_id:
          type: string
        form_id:
          type: string
        data:
          type: object
        upload:
          type: object
        user_data:
          type: object
        user_agent:
          type: string
        ip:
          type: string
        language:
          type: string
        timestamp:
          type: string
          format: date-time
    WebhookTbaRequest:
      type: object
      properties:
        message_type:
          type: string
          description: Type of TBA notification
          enum:
            - ping
            - verification
        message_data:
          type: object
          properties:
            title:
              type: string
              description: Title of the ping notification
            desc:
              type: string
              description: Description of the ping notification
            verification_key:
              type: string
              description: Verification key for webhook verification
    WebhookStatus:
      type: object
      properties:
        verified:
          type: boolean
          description: Whether the webhook is verified
        lastPing:
          type: string
          format: date-time
          description: Timestamp of the last ping received
        status:
          type: string
          enum:
            - active
            - inactive
            - pending
          description: Current status of the webhook
    CreateAssignmentRequest:
      type: object
      properties:
        event_key:
          type: string
          description: Event key (e.g. 2025ohcl)
        task_type:
          type: string
          enum:
            - scouting
            - pit-scouting
          description: Type of scouting task
        assigned_team_numbers:
          type: array
          items:
            type: integer
          description: List of team numbers for pit-scouting
        assigned_alliance:
          type: string
          enum:
            - red
            - blue
          description: Alliance color for scouting
        assigned_matches:
          type: string
          description: Range of matches for scouting (e.g. Q3-Q12)
        assignees_data:
          type: array
          items:
            $ref: "#/components/schemas/UserData"
          description: List of users assigned to this task
        notes:
          type: string
          description: Additional notes for the assignment
      required:
        - event_key
        - task_type
        - assignees_data
    UpdateAssignmentRequest:
      type: object
      properties:
        assigned_team_numbers:
          type: array
          items:
            type: integer
          description: List of team numbers for pit-scouting
        assigned_alliance:
          type: string
          enum:
            - red
            - blue
          description: Alliance color for scouting
        assigned_matches:
          type: string
          description: Range of matches for scouting (e.g. Q3-Q12)
        assignees_data:
          type: array
          items:
            $ref: "#/components/schemas/UserData"
          description: List of users assigned to this task
        status:
          type: string
          enum:
            - pending
            - in_progress
            - completed
            - canceled
          description: Current status of the assignment
        notes:
          type: string
          description: Additional notes for the assignment
    TaskAssignment:
      type: object
      properties:
        id:
          type: integer
          description: Assignment ID
        event_key:
          type: string
          description: Event key (e.g. 2025ohcl)
        task_type:
          type: string
          enum:
            - scouting
            - pit-scouting
          description: Type of scouting task
        assigned_team_numbers:
          type: array
          items:
            type: integer
          description: List of team numbers for pit-scouting
        assigned_alliance:
          type: string
          enum:
            - red
            - blue
          description: Alliance color for scouting
        assigned_matches:
          type: string
          description: Range of matches for scouting (e.g. Q3-Q12)
        assigner_data:
          $ref: "#/components/schemas/UserData"
        assignees_data:
          type: array
          items:
            $ref: "#/components/schemas/UserData"
          description: List of users assigned to this task
        status:
